name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      update:
        description: Regenerate Linux visual baselines
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    # ~600 specs take about 22 minutes on the runner's two workers.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  visual:
    name: Visual (kit gallery, Linux)
    runs-on: ubuntu-latest
    # ~390 shots take about 25 minutes on two workers.
    timeout-minutes: 45
    # Linux baselines are produced with workflow_dispatch (update) first;
    # until they exist this job reports without blocking (decision G8).
    continue-on-error: true
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:visual ${{ github.event.inputs.update == 'true' && '--update-snapshots' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-linux
          path: |
            test/visual/__screenshots__/linux
            playwright-report
